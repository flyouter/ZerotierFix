name: Build APP

on:
  push:
    # dev 分支推送构建测试包；tag 推送构建并自动发布 GitHub Release
    branches: [ "dev" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub Release as a draft"
        type: boolean
        default: false

# 创建 Release 需要写权限；PR 运行由 GitHub 自动降为只读
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          # 生成更新日志、查找上一个 tag 需要完整的提交历史与 tag
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      # 直接用 Gradle 构建，避免 sparkfabrik action 内置 fastlane 的依赖漂移
      # PR 保留 debug 包便于排查；推送与 tag 构建发布用 release 包（R8 + 资源压缩）
      - name: Build APK
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            ./gradlew --no-daemon assembleRelease
          fi
      - name: Verify 16 KB page alignment
        shell: bash
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/*/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No APKs found for 16 KB alignment check"
            exit 1
          fi
          tools/check-16kb.sh "${APKS[@]}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        name: Upload app APK
        with:
          name: App bundle
          # 按 ABI 拆分的 debug APK（含 universal 包）
          path: app/build/outputs/apk/debug/*.apk
      - name: Validate signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          missing=0
          for name in SIGNING_KEY ALIAS KEY_STORE_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Secret $name is not configured for this repository"
              missing=1
            else
              echo "$name: configured (${#value} chars)"
            fi
          done
          exit $missing
      # https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION
      - uses: r0adkll/sign-android-release@v1
        if: github.event_name != 'pull_request'
        name: Sign app APK
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        name: Upload signed app APK
        with:
          name: Signed app bundle
          # 多架构打包时 signedReleaseFile 为空，改用通配符收集全部签名产物
          path: app/build/outputs/apk/release/*-signed.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        name: Upload R8 mapping
        with:
          name: R8 mapping
          # 混淆后的崩溃栈需要它还原，保留在 workflow artifact 中
          path: app/build/outputs/mapping/release/mapping.txt
      # ---------- 以下步骤仅在 tag 构建时执行 ----------
      - name: Prepare release metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # tag 必须与 app/build.gradle 中的 App 版本一致（versionName 去掉 +core.x.y）
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          APP_VERSION="${VERSION_NAME%%+*}"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match app version '$APP_VERSION' (versionName: '$VERSION_NAME')"
            exit 1
          fi
          # 完整 versionName（含 +core.x.y），用于发布包文件名
          echo "APP_VERSION_FULL=$VERSION_NAME" >> "$GITHUB_ENV"

          # 标题与 prerelease 判定，沿用历史格式
          case "$TAG" in
            *[Aa][Ll][Pp][Hh][Aa]*) PREFIX="Alpha" ;;
            *[Bb][Ee][Tt][Aa]*)     PREFIX="Beta" ;;
            *[Rr][Cc]*)             PREFIX="RC" ;;
            *)                      PREFIX="" ;;
          esac
          if [ -n "$PREFIX" ]; then
            echo "RELEASE_NAME=$PREFIX Release $TAG" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_NAME=Release $TAG" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

          # 优先使用按 tag 维护的双语说明；缺失时回退到 commit 列表
          NOTES_FILE=".github/releases/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-notes.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            {
              echo "# Changes Log / 更新日志"
              echo
              if [ -n "$PREV_TAG" ]; then
                git log --no-merges --pretty='- %h %s' "${PREV_TAG}..${TAG}"
              else
                git log --no-merges --pretty='- %h %s' "$TAG"
              fi
            } > release-notes.md
          fi

          # 哈希段由下一步对最终 APK 重新生成，移除手写的旧内容
          sed -i '/^# File Hash/,$d' release-notes.md

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP_VERSION_FULL:-}" ]; then
            echo "::error::APP_VERSION_FULL is empty"
            exit 1
          fi

          # sign-android-release v1 的 action.yml 声明了多文件输出，但其 lib/main.js
          # 只实际设置单个 signedReleaseFile，这里按 -signed 命名规则直接收集
          shopt -s nullglob
          FILES=(app/build/outputs/apk/release/app-*-release-unsigned-signed.apk)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No signed APKs were produced"
            exit 1
          fi

          ASSETS=()
          HASH_LINES=()
          for SRC in "${FILES[@]}"; do
            if [ ! -f "$SRC" ]; then
              echo "::error::Signed APK not found: '$SRC'"
              exit 1
            fi

            # app-<abi>-release-unsigned-signed.apk -> <abi>（universal 包为 universal）
            BASE=$(basename "$SRC")
            if [[ "$BASE" != app-*-release-unsigned-signed.apk ]]; then
              echo "::error::Unexpected signed APK name: '$BASE'"
              exit 1
            fi
            ABI="${BASE#app-}"
            ABI="${ABI%-release-unsigned-signed.apk}"

            ASSET_NAME="zerotier-fix-${APP_VERSION_FULL}-${ABI}.apk"
            cp "$SRC" "$ASSET_NAME"
            ASSETS+=("$ASSET_NAME")
            HASH_LINES+=("- \`$ASSET_NAME\`")
            HASH_LINES+=("  - MD5: $(md5sum "$ASSET_NAME" | awk '{print $1}')")
            HASH_LINES+=("  - SHA1: $(sha1sum "$ASSET_NAME" | awk '{print $1}')")
            HASH_LINES+=("  - SHA256: $(sha256sum "$ASSET_NAME" | awk '{print $1}')")
          done

          # 发布资产为多行列表，供 softprops/action-gh-release 的 files 使用
          {
            echo "RELEASE_ASSETS<<EOF"
            printf '%s\n' "${ASSETS[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

          {
            echo
            echo "# File Hash / 文件哈希"
            echo
            printf '%s\n' "${HASH_LINES[@]}"
          } >> release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.md
          prerelease: ${{ env.PRERELEASE == 'true' }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          files: ${{ env.RELEASE_ASSETS }}
          fail_on_unmatched_files: true
          overwrite_files: true
