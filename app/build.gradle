plugins {
    id 'com.android.application'
}

apply plugin: 'com.google.devtools.ksp'

// Room 导出的 schema，用于校验和后续迁移
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

// 版本号手动维护：<App 版本>+core.<ZeroTier 核心版本>
android {
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "net.kaaass.zerotierfix"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 16
        versionName = "1.0.11+core.1.16.2"

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 仅支持 64 位 ABI，按 ABI 拆分成独立的 APK，
    // 另生成一个包含全部架构的 universal 包。
    // 产物：app-<abi>-<variant>.apk 与 app-universal-<variant>.apk
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    configurations {
        all {
            exclude module: 'httpclient'
            exclude module: 'commons-logging'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    namespace = 'net.kaaass.zerotierfix'
}

dependencies {
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation 'commons-io:commons-io:2.22.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'commons-validator:commons-validator:1.11.0'
    //noinspection AnnotationProcessorOnCompilePath
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}