plugins {
    id 'com.android.application'
}

apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.dagger.hilt.android'

// Room 导出的 schema，用于校验和后续迁移
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

// 版本号手动维护：<App 版本>+core.<ZeroTier 核心版本>
android {
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "net.kaaass.zerotierfix"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 16
        versionName = "1.0.11+core.1.16.2"

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 仅支持 64 位 ABI，按 ABI 拆分成独立的 APK，
    // 另生成一个包含全部架构的 universal 包。
    // 产物：app-<abi>-<variant>.apk 与 app-universal-<variant>.apk
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    configurations {
        all {
            exclude module: 'httpclient'
            exclude module: 'commons-logging'
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    namespace = 'net.kaaass.zerotierfix'
}

hilt {
    enableAggregatingTask = false
}

dependencies {
    implementation project(':core')

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'commons-io:commons-io:2.22.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'commons-validator:commons-validator:1.11.0'

    // Compose / Material 3
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    // Activity / Lifecycle / Navigation
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.60.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'

    // Kotlin 协程
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
}