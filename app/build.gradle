plugins {
    id 'com.android.application'
}

// greenDAO 代码生成。原 org.greenrobot.greendao 插件在 AGP 9 上无法应用，
// 由其代码生成器 greendao-code-modifier 直接驱动，见 buildSrc。
def greendaoSchemaVersion = 22
def greendaoDaoPackage = 'net.kaaass.zerotierfix.model'

def greendaoGenerate = tasks.register('greendaoGenerate', buildlogic.GreendaoGenerateTask) {
    sourceFiles.from(fileTree('src/main/java') { include '**/*.java' })
    schemaVersion.set(greendaoSchemaVersion)
    daoPackage.set(greendaoDaoPackage)
    outputDir.set(layout.buildDirectory.dir('generated/source/greendao'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java?.addGeneratedSourceDirectory(
                greendaoGenerate, { task -> task.outputDir } as kotlin.jvm.functions.Function1)
    }
}

// 版本号手动维护：<App 版本>+core.<ZeroTier 核心版本>
android {
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "net.kaaass.zerotierfix"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 16
        versionName = "1.0.11+core.1.16.2"
        multiDexEnabled = true

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 仅支持 64 位 ABI，按 ABI 拆分成独立的 APK，
    // 另生成一个包含全部架构的 universal 包。
    // 产物：app-<abi>-<variant>.apk 与 app-universal-<variant>.apk
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    configurations {
        all {
            exclude module: 'httpclient'
            exclude module: 'commons-logging'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    namespace = 'net.kaaass.zerotierfix'
}

dependencies {
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation 'commons-io:commons-io:2.11.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'commons-validator:commons-validator:1.7'
    implementation "androidx.multidex:multidex:2.0.1"
    //noinspection AnnotationProcessorOnCompilePath
    compileOnly 'org.projectlombok:lombok:1.18.20'
    annotationProcessor 'org.projectlombok:lombok:1.18.20'
}