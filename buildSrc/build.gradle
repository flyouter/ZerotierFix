plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    // The published greenDAO Gradle plugin cannot be applied on AGP 9 (it still
    // looks up the removed AndroidConfig extension), so we drive its code
    // generator ourselves. Only the generator library is used here.
    implementation 'org.greenrobot:greendao-code-modifier:3.3.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
