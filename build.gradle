// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        // 抬升 AGP 内置 Kotlin（AGP 对 KGP 是软约束，classpath 更高版本生效），
        // 以读取 Kotlin 2.3 metadata（zxing-cpp 3.1.x 需要）
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        // KSP 2.3+ 起版本与 Kotlin 解耦，2.3.12 支持 Kotlin 2.4 / AGP 9
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.12'
        // Compose 编译器插件版本必须与 Kotlin 2.4.21 一致
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.21'
        // Hilt 2.58+ 支持 AGP 9 新 DSL
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.60.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    compileSdkVersion = 37
    minSdkVersion = 29
    targetSdkVersion = 37
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}