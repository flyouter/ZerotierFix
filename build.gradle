// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        // KSP 版本需与 AGP 9.4.1 内置 Kotlin（2.2.10）匹配
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.10-2.0.2'
        // Compose 编译器插件版本必须与内置 Kotlin 2.2.10 一致
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.2.10'
        // Hilt 2.58+ 支持 AGP 9 新 DSL
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.60.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    compileSdkVersion = 37
    minSdkVersion = 29
    targetSdkVersion = 37
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}